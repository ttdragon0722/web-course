<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Course · 結業拍照牆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --text: #111;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #fafafa;
    --c1: #0369a1;  /* 藍 */
    --c2: #6d28d9;  /* 紫 */
    --c3: #f59e0b;  /* 琥珀 */
    --c4: #10b981;  /* 綠 */
    --c5: #ef4444;  /* 紅 */
    --c6: #06b6d4;  /* 青 */
  }

  html, body {
    height: 100%;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .wall {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── 重複品牌底紋（step-and-repeat）── */
  .backdrop {
    position: absolute;
    inset: -20%;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 18px 40px;
    transform: rotate(-18deg);
    opacity: 0.55;
    pointer-events: none;
    user-select: none;
  }
  .backdrop span {
    font-size: clamp(18px, 2vw, 30px);
    font-weight: 800;
    letter-spacing: 0.06em;
    white-space: nowrap;
    color: #e7eaee;
  }
  .backdrop span:nth-child(7n)  { color: #dbeafe; }
  .backdrop span:nth-child(7n+3){ color: #ede9fe; }
  .backdrop span:nth-child(7n+5){ color: #fef3c7; }

  /* 讓中央主視覺更跳出來的柔光 */
  .wall::after {
    content: "";
    position: absolute;
    z-index: 2;
    width: 120vmin;
    height: 80vmin;
    background: radial-gradient(closest-side, rgba(250,250,250,0.92), rgba(250,250,250,0.55) 60%, transparent 100%);
    pointer-events: none;
  }

  /* ── 中央主視覺 ── */
  .stage {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 32px;
    animation: pop 0.7s cubic-bezier(0.2, 0.9, 0.2, 1.2) both;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(0.96); }
    to   { opacity: 1; transform: none; }
  }

  .eyebrow {
    font-size: clamp(12px, 1.4vw, 16px);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 18px;
  }

  .title {
    font-size: clamp(48px, 11vw, 150px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 0.98;
    margin-bottom: 10px;
  }
  .title .accent {
    background: linear-gradient(120deg, var(--c1), var(--c2) 45%, var(--c5) 80%, var(--c3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    font-size: clamp(15px, 2.1vw, 26px);
    color: #374151;
    font-weight: 500;
    margin: 14px 0 26px;
    letter-spacing: 0.01em;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 30px;
  }
  .chips .chip {
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: clamp(12px, 1.5vw, 17px);
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 999px;
    background: #fff;
    border: 1.5px solid var(--line);
    color: #111;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .chips .chip.c1 { border-color: var(--c1); color: var(--c1); }
  .chips .chip.c2 { border-color: var(--c2); color: var(--c2); }
  .chips .chip.c3 { border-color: var(--c3); color: #b45309; }
  .chips .chip.c4 { border-color: var(--c4); color: #047857; }
  .chips .chip.c5 { border-color: var(--c5); color: var(--c5); }
  .chips .chip.dark { background: #111; border-color: #111; color: #fff; }

  .meta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-size: clamp(13px, 1.6vw, 19px);
    color: var(--muted);
    font-weight: 500;
  }
  .meta .dot { width: 5px; height: 5px; border-radius: 50%; background: #cbd5e1; }
  .meta .hash { color: #111; font-weight: 700; }

  /* ── 彩色紙花 ── */
  .confetti { position: absolute; z-index: 2; pointer-events: none; }
  .confetti i {
    position: absolute;
    display: block;
    width: 14px; height: 14px;
    border-radius: 3px;
    opacity: 0.9;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-16px) rotate(22deg); }
  }

  /* 角落提示 */
  .hint {
    position: absolute;
    z-index: 4;
    bottom: 18px;
    right: 22px;
    font-size: 12px;
    color: #9ca3af;
    letter-spacing: 0.04em;
  }

  @media (max-width: 600px) {
    .backdrop { gap: 12px 26px; }
    .meta { flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>
  <div class="wall">
    <div class="backdrop" id="backdrop"></div>

    <!-- 彩色紙花 -->
    <div class="confetti">
      <i style="top:14%; left:10%; background:var(--c1)"></i>
      <i style="top:22%; left:84%; background:var(--c3); animation-delay:.6s"></i>
      <i style="top:70%; left:8%;  background:var(--c4); animation-delay:1.1s"></i>
      <i style="top:78%; left:88%; background:var(--c2); animation-delay:.3s"></i>
      <i style="top:40%; left:6%;  background:var(--c5); animation-delay:1.5s"></i>
      <i style="top:55%; left:92%; background:var(--c6); animation-delay:.9s"></i>
      <i style="top:12%; left:48%; background:var(--c2); animation-delay:1.8s"></i>
      <i style="top:86%; left:46%; background:var(--c3); animation-delay:.5s"></i>
    </div>

    <div class="stage">
      <div class="eyebrow">Web Course · 2026</div>
      <h1 class="title"><span class="accent">網頁前端</span>入門課程</h1>
      <p class="sub">從 0 到做出自己的作品 🎉</p>
      <div class="chips">
        <span class="chip c1">#HTML</span>
        <span class="chip c2">#CSS</span>
        <span class="chip c3">#JavaScript</span>
        <span class="chip c4">#Tailwind</span>
        <span class="chip c5">#React</span>
        <span class="chip dark">#全端</span>
      </div>
      <div class="meta">
        <span class="dot"></span>
        <span class="hash">#WebCourse2026</span>
        <span class="dot"></span>
      </div>
    </div>

  </div>

  <script>
    // 產生 step-and-repeat 重複底紋
    (function () {
      var bd = document.getElementById('backdrop');
      var label = 'WEB COURSE ★ 2026';
      var n = 300;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < n; i++) {
        var s = document.createElement('span');
        s.textContent = label;
        frag.appendChild(s);
      }
      bd.appendChild(frag);
    })();
  </script>
</body>
</html>
